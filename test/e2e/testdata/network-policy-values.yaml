# For the opt-in TrainJob network isolation E2E suite on a disposable cluster.
manager:
  config:
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  network-policy-test-allowed: "true"
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - to:
            - podSelector:
                matchLabels:
                  network-policy-test-allowed: "true"
