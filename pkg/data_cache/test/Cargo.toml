[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.32"
arrow-flight = "55.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tonic = "0.12.3"
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6", features = ["derive", "env"] }

[[bin]]
name = "client"
path = "src/main.rs"
