[package]
name = "kubeflow_data_cache"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
tokio = { version = "1.52.3", features = ["full"] }
datafusion = "53.1"
arrow = "58"
arrow-schema = "58"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
iceberg-datafusion = "0.10.1"
iceberg = "0.10.1"
iceberg-storage-opendal = "0.10.1"
futures = "0.3.32"
arrow-flight = "58"
tonic = "0.14"
bytes = "1.11.1"
bincode = "2.0.1"
hickory-resolver = "0.26.3"
axum = "0.8"
tower = "0.5"
hyper = "1.9"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[[bin]]
name = "head"
path = "cmd/head/main.rs"

[[bin]]
name = "worker"
path = "cmd/worker/main.rs"
