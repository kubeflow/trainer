[package]
name = "kubeflow_data_cache"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
tokio = { version = "1.52.3", features = ["full"] }
datafusion = "47.0.0"
arrow = "55.0.0"
arrow-schema = "55.0.0"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
iceberg-datafusion = "0.6.0"
iceberg = "0.6.0"
futures = "0.3.32"
arrow-flight = "55.0.0"
tonic = "0.12.3"
bytes = "1.11.1"
bincode = "2.0.1"
hickory-resolver = "0.24.2"
axum = "0.8"
tower = "0.5"
hyper = "1.9"
# Only used by the `local-fixtures` test helpers to write Parquet data files.
# Already built as a transitive dependency of `iceberg`.
parquet = { version = "55.0.0", optional = true }
serde_json = { version = "1.0.145", optional = true }

[features]
# Compiles the helpers that generate a local Iceberg table. Enabled automatically
# for test builds; the `head` and `worker` binaries are built without it.
local-fixtures = ["dep:parquet", "dep:serde_json"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
parquet = "55.0.0"
serde_json = "1.0.145"
tempfile = "3.18"

[[bin]]
name = "head"
path = "cmd/head/main.rs"

[[bin]]
name = "worker"
path = "cmd/worker/main.rs"
