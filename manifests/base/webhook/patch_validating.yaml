# controller-gen orders the webhooks by name. The test operations fail the build when a new
# webhook shifts the order, so that every replacement below targets the intended webhook.
- op: test
  path: /webhooks/0/name
  value: validator.clustertrainingruntime.trainer.kubeflow.org
- op: test
  path: /webhooks/1/name
  value: validator.optimizationjob.trainer.kubeflow.org
- op: test
  path: /webhooks/2/name
  value: validator.trainingruntime.trainer.kubeflow.org
- op: test
  path: /webhooks/3/name
  value: validator.trainjob.trainer.kubeflow.org
- op: replace
  path: /webhooks/0/clientConfig/service/name
  value: kubeflow-trainer-controller-manager
- op: replace
  path: /webhooks/1/clientConfig/service/name
  value: kubeflow-trainer-controller-manager
- op: replace
  path: /webhooks/2/clientConfig/service/name
  value: kubeflow-trainer-controller-manager
- op: replace
  path: /webhooks/3/clientConfig/service/name
  value: kubeflow-trainer-controller-manager
- op: replace
  path: /metadata/name
  value: validator.trainer.kubeflow.org
- op: add
  path: /webhooks/0/objectSelector
  value:
    matchExpressions:
      - key: trainer.kubeflow.org/webhook-validation
        operator: NotIn
        values:
          - disabled
- op: add
  path: /webhooks/2/objectSelector
  value:
    matchExpressions:
      - key: trainer.kubeflow.org/webhook-validation
        operator: NotIn
        values:
          - disabled
