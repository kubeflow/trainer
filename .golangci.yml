linters-settings:
  staticcheck:
    # Default set, minus the deprecation check.
    #
    # Upgrading to Kubernetes 1.36 and controller-runtime v0.24 deprecated
    # several APIs this repository still uses:
    #
    #   - builder.WithCustomValidator and webhook.CustomValidator, superseded
    #     by the generic admission.Validator[T]
    #   - manager.GetEventRecorderFor, superseded by GetEventRecorder
    #   - scheme.Builder in pkg/apis/kubeflow.org/v1
    #
    # All of them still function. Migrating them is a behavioural refactor
    # rather than a dependency bump, so it is tracked separately and excluded
    # here to keep the linter meaningful in the meantime.
    checks: ["*", "-SA1019"]
