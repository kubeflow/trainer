# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".github/copilot-instructions.md"
      - "AGENTS.md"

reviews:
  auto_review:
    labels:
      - "!do-not-merge/work-in-progress"
      - "!do-not-merge/hold"

  path_filters:
    # Generated Go code (make generate).
    - "!**/zz_generated.*.go"
    - "!pkg/client/**"
    # Generated API artifacts (OpenAPI spec, Python API models).
    - "!api/**"
    # Generated CRD manifests.
    - "!manifests/base/crds/**"
    # Lock files.
    - "!**/go.sum"
    - "!**/uv.lock"
    - "!**/Cargo.lock"
    # Release changelogs.
    - "!CHANGELOG/**"
