# Kind cluster configuration for Kubeflow Trainer Workload-Aware Scheduling e2e tests.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  GenericWorkload: true
  TopologyAwareWorkloadScheduling: true
  DRAWorkloadResourceClaims: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiVersion: kubeadm.k8s.io/v1beta4
        apiServer:
          extraArgs:
          - name: runtime-config
            # Trainer creates Workload and PodGroup objects via the scheduling.k8s.io/v1beta1 API.
            value: "scheduling.k8s.io/v1beta1=true"
