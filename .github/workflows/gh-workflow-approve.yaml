name: Approve Workflow Runs

permissions:
  actions: write
  contents: read

on:
  pull_request_target:
    types:
      - labeled
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  ok-to-test:
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check if author is a Kubeflow GitHub member
        id: membership-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            const org = context.repo.owner;
            try {
              const res = await github.rest.orgs.checkMembershipForUser({
                org,
                username
              });
              core.setOutput("is_member", true);
            } catch (error) {
              if (error.status === 404) {
                // User is not a member
                core.setOutput("is_member", false);
              } else {
                throw error;
              }
            }

      - name: Approve Pending Workflow Runs
        if: steps.membership-check.outputs.is_member == 'true' || contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          IS_MEMBER: ${{ steps.membership-check.outputs.is_member }}
        with:
          retries: 3
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: "pull_request",
              status: "action_required",
              head_sha: context.payload.pull_request.head.sha,
            }

            // On a push this job can start before GitHub has created the PR's workflow runs,
            // and the runs for one commit are created over about a second. So retry for a
            // short while, and once some runs show up, look once more to catch the rest.
            // Members' runs never need approval, so they get a single lookup.
            const attempts = process.env.IS_MEMBER === "true" ? 1 : 6
            const delayMs = 10_000
            const sleep = () => new Promise((resolve) => setTimeout(resolve, delayMs))
            const pending = new Map()
            const lookup = async (label) => {
              core.info(`Getting workflow runs that need approval for commit ${request.head_sha} (${label})`)
              for (const run of await github.paginate(github.rest.actions.listWorkflowRunsForRepo, request)) {
                pending.set(run.id, run)
              }
            }
            for (let attempt = 1; attempt <= attempts; attempt++) {
              await lookup(`attempt ${attempt}/${attempts}`)
              if (pending.size > 0 || attempt === attempts) {
                break
              }
              await sleep()
            }
            if (attempts > 1 && pending.size > 0) {
              await sleep()
              await lookup("follow-up")
            }
            const runs = [...pending.values()]

            core.info(`Found ${runs.length} workflow runs that need approval`)
            for (const run of runs) {
              core.info(`Approving workflow run ${run.id}`)
              const request = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }
              await github.rest.actions.approveWorkflowRun(request)
            }
