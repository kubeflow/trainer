# Reusable workflow to build a Kubeflow Trainer image on a native runner for each architecture
# and to publish it as a single multi-arch image.
name: Build and Publish Container Image

on:
  workflow_call:
    inputs:
      component-name:
        required: true
        type: string
        description: name of the component to build, e.g. trainer-controller-manager
      dockerfile:
        required: true
        type: string
        description: path for Dockerfile
      x86-platforms:
        required: true
        type: string
        description: platforms to build on the x86 runner, e.g. linux/amd64
      arm-platforms:
        required: false
        type: string
        default: ""
        description: platforms to build on the arm runner, e.g. linux/arm64. The arm build is skipped when it is empty
      context:
        required: false
        type: string
        default: .
        description: e.g, examples/xgboost/xgboost-dist
      ref:
        required: false
        type: string
        default: ""
        description: git ref (tag, branch, or SHA) to check out and build the image from
      version:
        required: false
        type: string
        default: ""
        description: explicit image tag (e.g. v2.3.0-rc.0) for builds not triggered by a tag push
      publish:
        required: false
        type: boolean
        default: false
        description: whether to push the built image to registries
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.component-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # The arm64 build is skipped for the components without arm platforms.
        arch: ${{ fromJSON(inputs.arm-platforms != '' && '["x86", "arm64"]' || '["x86"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'cncf-ubuntu-16-64-arm' || 'cncf-ubuntu-16-64-x86' }}
    env:
      # Images are never pushed on pull requests.
      SHOULD_PUBLISH: ${{ inputs.publish }}
      PLATFORMS: ${{ matrix.arch == 'arm64' && inputs.arm-platforms || inputs.x86-platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: GHCR Login
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate to Docker Hub to avoid the rate limits for the base images.
      - name: Docker Hub Login
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # QEMU is only required for ppc64le, which has no native runner. amd64 and arm64 build natively.
      - name: Setup QEMU
        if: contains(env.PLATFORMS, 'ppc64le')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: ppc64le

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Push by digest only, the tags are created once the images for all architectures are built.
      - name: Build and Push By Digest
        if: env.SHOULD_PUBLISH == 'true'
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          platforms: ${{ env.PLATFORMS }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          outputs: type=image,name=ghcr.io/kubeflow/trainer/${{ inputs.component-name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.component-name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.component-name }}-${{ matrix.arch }},ignore-error=true

      - name: Test Build
        if: env.SHOULD_PUBLISH != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          platforms: ${{ env.PLATFORMS }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ inputs.component-name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.component-name }}-${{ matrix.arch }},ignore-error=true

      - name: Export Digest
        if: env.SHOULD_PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        if: env.SHOULD_PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ inputs.component-name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into a single multi-arch image and push the tags.
  # It runs only when the builds for all architectures of the component succeeded.
  publish:
    name: Publish ${{ inputs.component-name }}
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.component-name }}-*
          merge-multiple: true

      - name: GHCR Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Add Docker Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/kubeflow/trainer/${{ inputs.component-name }}
            docker.io/kubeflow/${{ inputs.component-name }}
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Create Manifest List And Push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ inputs.component-name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect Image
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ inputs.component-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
