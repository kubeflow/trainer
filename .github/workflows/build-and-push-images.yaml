name: Build and Publish Images

on:
  push:
    branches:
      - master
      - "release-*"
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'proposals/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: git ref (tag, branch, or SHA) to check out and build the images from
        required: false
        type: string
        default: ""
      version:
        description: explicit image tag (e.g. v2.3.0-rc.0) to publish
        required: false
        type: string
        default: ""
      publish:
        description: whether to push the built images to registries
        required: false
        type: boolean
        default: false

jobs:
  # Build every image on a native runner for each architecture to avoid slow QEMU emulation.
  # Images are pushed by digest only, the tags are created by the merge-manifests job.
  build-and-publish:
    name: Build and Publish Images
    if: github.repository == 'kubeflow/trainer'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: trainer-controller-manager
            dockerfile: cmd/trainer-controller-manager/Dockerfile
            x86_platforms: linux/amd64,linux/ppc64le
            arm_platforms: linux/arm64

          - name: model-initializer
            dockerfile: cmd/initializers/model/Dockerfile
            x86_platforms: linux/amd64
            arm_platforms: linux/arm64

          - name: dataset-initializer
            dockerfile: cmd/initializers/dataset/Dockerfile
            x86_platforms: linux/amd64
            arm_platforms: linux/arm64

          - name: deepspeed-runtime
            dockerfile: cmd/runtimes/deepspeed/Dockerfile
            x86_platforms: linux/amd64
            arm_platforms: linux/arm64

          - name: xgboost-runtime
            dockerfile: cmd/runtimes/xgboost/Dockerfile
            x86_platforms: linux/amd64
            arm_platforms: linux/arm64

          # TODO (andreyvelich): mlx-data doesn't provide Linux arm wheels at the moment:
          # https://pypi.org/project/mlx-data/#files
          - name: mlx-runtime
            dockerfile: cmd/runtimes/mlx/Dockerfile
            x86_platforms: linux/amd64

          # TODO (jaiakash): pytorch/pytorch CUDA base image doesn't support arm at the moment:
          # https://hub.docker.com/r/pytorch/pytorch/tags?name=2.9.1-cuda12.8-cudnn9-runtime
          - name: torchtune-trainer
            dockerfile: cmd/trainers/torchtune/Dockerfile
            x86_platforms: linux/amd64

          - name: data-cache
            dockerfile: cmd/data_cache/Dockerfile
            x86_platforms: linux/amd64
            arm_platforms: linux/arm64

        arch:
          - name: x86
            runs-on: cncf-ubuntu-16-64-x86
            platforms_key: x86_platforms

          - name: arm64
            runs-on: cncf-ubuntu-16-64-arm
            platforms_key: arm_platforms

        exclude:
          - component:
              name: mlx-runtime
            arch:
              name: arm64

          - component:
              name: torchtune-trainer
            arch:
              name: arm64

    uses: ./.github/workflows/publish-images.yaml
    with:
      component-name: ${{ matrix.component.name }}
      dockerfile: ${{ matrix.component.dockerfile }}
      platforms: ${{ matrix.component[matrix.arch.platforms_key] }}
      arch: ${{ matrix.arch.name }}
      runs-on: ${{ matrix.arch.runs-on }}
      # Checkout to the release tag when called from the release workflow.
      ref: ${{ inputs.ref }}
      publish: ${{ inputs.publish || github.event_name == 'push' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Combine the per-architecture digests into a single multi-arch image and push the tags.
  merge-manifests:
    name: Publish Multi-Arch Images
    needs: build-and-publish
    # Run even when some builds failed, so one broken component doesn't block the others.
    # The Verify Digests step fails the components whose builds are incomplete.
    if: ${{ !cancelled() && needs.build-and-publish.result != 'skipped' && (inputs.publish || github.event_name == 'push') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # digests is the number of runner architectures the component is built on.
        include:
          - component-name: trainer-controller-manager
            digests: 2
          - component-name: model-initializer
            digests: 2
          - component-name: dataset-initializer
            digests: 2
          - component-name: deepspeed-runtime
            digests: 2
          - component-name: xgboost-runtime
            digests: 2
          - component-name: mlx-runtime
            digests: 1
          - component-name: torchtune-trainer
            digests: 1
          - component-name: data-cache
            digests: 2

    steps:
      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component-name }}-*
          merge-multiple: true

      - name: Verify Digests
        env:
          COMPONENT: ${{ matrix.component-name }}
          EXPECTED: ${{ matrix.digests }}
        run: |
          actual=$(find "${RUNNER_TEMP}/digests" -type f 2>/dev/null | wc -l)
          if [ "${actual}" -ne "${EXPECTED}" ]; then
            echo "::error::Expected ${EXPECTED} image digests for ${COMPONENT}, found ${actual}"
            exit 1
          fi

      - name: GHCR Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Add Docker Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
            docker.io/kubeflow/${{ matrix.component-name }}
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Create Manifest List And Push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect Image
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
