name: Build and Publish Images

on:
  push:
    branches:
      - master
      - "release-*"
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'proposals/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: git ref (tag, branch, or SHA) to check out and build the images from
        required: false
        type: string
        default: ""
      version:
        description: explicit image tag (e.g. v2.3.0-rc.0) to publish
        required: false
        type: string
        default: ""
      publish:
        description: whether to push the built images to registries
        required: false
        type: boolean
        default: false

jobs:
  # Every component is built on a native runner for each architecture to avoid slow QEMU emulation.
  # The platforms of a component are defined only here, omit arm-platforms to skip the arm64 build.
  build-and-publish:
    name: Build and Publish Images (${{ matrix.component-name }})
    if: github.repository == 'kubeflow/trainer'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component-name: trainer-controller-manager
            dockerfile: cmd/trainer-controller-manager/Dockerfile
            x86-platforms: linux/amd64,linux/ppc64le
            arm-platforms: linux/arm64

          - component-name: model-initializer
            dockerfile: cmd/initializers/model/Dockerfile
            x86-platforms: linux/amd64
            arm-platforms: linux/arm64

          - component-name: dataset-initializer
            dockerfile: cmd/initializers/dataset/Dockerfile
            x86-platforms: linux/amd64
            arm-platforms: linux/arm64

          - component-name: deepspeed-runtime
            dockerfile: cmd/runtimes/deepspeed/Dockerfile
            x86-platforms: linux/amd64
            arm-platforms: linux/arm64

          - component-name: xgboost-runtime
            dockerfile: cmd/runtimes/xgboost/Dockerfile
            x86-platforms: linux/amd64
            arm-platforms: linux/arm64

          # TODO (andreyvelich): mlx-data doesn't provide Linux arm wheels at the moment:
          # https://pypi.org/project/mlx-data/#files
          - component-name: mlx-runtime
            dockerfile: cmd/runtimes/mlx/Dockerfile
            x86-platforms: linux/amd64

          # TODO (jaiakash): pytorch/pytorch CUDA base image doesn't support arm at the moment:
          # https://hub.docker.com/r/pytorch/pytorch/tags?name=2.9.1-cuda12.8-cudnn9-runtime
          - component-name: torchtune-trainer
            dockerfile: cmd/trainers/torchtune/Dockerfile
            x86-platforms: linux/amd64

          - component-name: data-cache
            dockerfile: cmd/data_cache/Dockerfile
            x86-platforms: linux/amd64
            arm-platforms: linux/arm64

    uses: ./.github/workflows/publish-images.yaml
    with:
      component-name: ${{ matrix.component-name }}
      dockerfile: ${{ matrix.dockerfile }}
      x86-platforms: ${{ matrix.x86-platforms }}
      arm-platforms: ${{ matrix.arm-platforms }}
      # Checkout to the release tag when called from the release workflow.
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish || github.event_name == 'push' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
