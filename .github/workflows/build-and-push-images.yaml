name: Build and Publish Images

on:
  push:
    branches:
      - master
      - "release-*"
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'proposals/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: git ref (tag, branch, or SHA) to check out and build the images from
        required: false
        type: string
        default: ""
      version:
        description: explicit image tag (e.g. v2.3.0-rc.0) to publish
        required: false
        type: string
        default: ""
      publish:
        description: whether to push the built images to registries
        required: false
        type: boolean
        default: false

jobs:
  # Every image is built on a native runner for each architecture to avoid slow QEMU emulation.
  # The images are pushed by digest only, the publish job creates the multi-arch images and the tags.
  build:
    name: Build ${{ matrix.component-name }} (${{ matrix.arch }})
    if: github.repository == 'kubeflow/trainer'
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component-name: &components
          - trainer-controller-manager
          - model-initializer
          - dataset-initializer
          - deepspeed-runtime
          - xgboost-runtime
          - mlx-runtime
          - torchtune-trainer
          - data-cache
        arch:
          - x86
          - arm64
        exclude:
          # TODO (andreyvelich): mlx-data doesn't provide Linux arm wheels at the moment:
          # https://pypi.org/project/mlx-data/#files
          - component-name: mlx-runtime
            arch: arm64
          # TODO (jaiakash): pytorch/pytorch CUDA base image doesn't support arm at the moment:
          # https://hub.docker.com/r/pytorch/pytorch/tags?name=2.9.1-cuda12.8-cudnn9-runtime
          - component-name: torchtune-trainer
            arch: arm64
        include:
          # Runner and platform for each architecture.
          - arch: x86
            runner: cncf-ubuntu-16-64-x86
            platforms: linux/amd64
          - arch: arm64
            runner: cncf-ubuntu-16-64-arm
            platforms: linux/arm64

          # Dockerfile for each component.
          - component-name: trainer-controller-manager
            dockerfile: cmd/trainer-controller-manager/Dockerfile
          - component-name: model-initializer
            dockerfile: cmd/initializers/model/Dockerfile
          - component-name: dataset-initializer
            dockerfile: cmd/initializers/dataset/Dockerfile
          - component-name: deepspeed-runtime
            dockerfile: cmd/runtimes/deepspeed/Dockerfile
          - component-name: xgboost-runtime
            dockerfile: cmd/runtimes/xgboost/Dockerfile
          - component-name: mlx-runtime
            dockerfile: cmd/runtimes/mlx/Dockerfile
          - component-name: torchtune-trainer
            dockerfile: cmd/trainers/torchtune/Dockerfile
          - component-name: data-cache
            dockerfile: cmd/data_cache/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout to the release tag when called from the release workflow.
          ref: ${{ inputs.ref }}

      - name: GHCR Login
        if: inputs.publish || github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate to Docker Hub to avoid the rate limits for the base images.
      - name: Docker Hub Login
        if: inputs.publish || github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Push by digest only, the tags are created once the images for all architectures are built.
      # Images are never pushed on pull requests, the build is only validated.
      - name: Build and Push By Digest
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          platforms: ${{ matrix.platforms }}
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=ghcr.io/kubeflow/trainer/${{ matrix.component-name }},push-by-digest=true,name-canonical=true,push=${{ inputs.publish || github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.component-name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.component-name }}-${{ matrix.arch }},ignore-error=true

      # The images are built on different runners, so the digests are passed to the publish job
      # as artifacts: an empty file named after the digest.
      - name: Export Digest
        if: inputs.publish || github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        if: inputs.publish || github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.component-name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the digests of all architectures into a single multi-arch image and push the tags.
  # It runs only when all the builds succeeded, so a partially built image is never published.
  publish:
    name: Publish ${{ matrix.component-name }}
    needs: build
    if: inputs.publish || github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component-name: *components

    steps:
      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component-name }}-*
          merge-multiple: true

      - name: GHCR Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Add Docker Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
            docker.io/kubeflow/${{ matrix.component-name }}
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Create Manifest List And Push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect Image
        env:
          IMAGE: ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
