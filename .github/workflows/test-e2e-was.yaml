name: E2E Tests - WAS

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "proposals/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  was-e2e-test:
    name: Workload-Aware Scheduling E2E Test
    runs-on: cncf-ubuntu-16-64-x86

    strategy:
      fail-fast: false
      matrix:
        # Workload-Aware Scheduling requires Kubernetes v1.37+.
        kubernetes-version: ["1.37.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: make kind

      - name: Setup Kind Cluster with Workload-Aware Scheduling
        run: |
          KIND=./bin/kind K8S_VERSION=${{ matrix.kubernetes-version }} ./hack/e2e-setup-cluster-was.sh
