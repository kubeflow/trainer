suite: Test manager ClusterRole

templates:
  - rbac/clusterrole.yaml

release:
  name: kubeflow-trainer
  namespace: kubeflow-system

tests:
  - it: Should create manager ClusterRole
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          name: kubeflow-trainer-controller-manager
      # The manager only creates TrainJobs (from the OptimizationJob controller), so
      # `create` must not leak onto the runtime and OptimizationJob resources.
      # The rules are generated from manifests/base/rbac/role.yaml by `make manifests`.
      - contains:
          path: rules
          content:
            apiGroups:
              - trainer.kubeflow.org
            resources:
              - clustertrainingruntimes
              - optimizationjobs
              - trainingruntimes
            verbs:
              - get
              - list
              - patch
              - update
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - trainer.kubeflow.org
            resources:
              - trainjobs
            verbs:
              - create
              - get
              - list
              - patch
              - update
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - trainer.kubeflow.org
            resources:
              - clustertrainingruntimes
              - optimizationjobs
              - trainingruntimes
              - trainjobs
            verbs:
              - create
              - get
              - list
              - patch
              - update
              - watch

  - it: Should allow managing Workload-Aware Scheduling objects
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - podgroups
              - workloads
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - watch

  - it: Should allow metrics authentication reviews
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - authentication.k8s.io
            resources:
              - tokenreviews
            verbs: ["create"]
      - contains:
          path: rules
          content:
            apiGroups:
              - authorization.k8s.io
            resources:
              - subjectaccessreviews
            verbs: ["create"]
