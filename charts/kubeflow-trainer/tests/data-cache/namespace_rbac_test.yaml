suite: Test data-cache namespace RBAC
templates:
  - templates/data-cache/namespace-rbac.yaml
release:
  name: kubeflow-trainer
  namespace: kubeflow-system
tests:
  - it: Should not render RBAC when dataCache.enabled is false
    set:
      dataCache:
        enabled: false
        namespaces:
          - default
    asserts:
      - hasDocuments:
          count: 0

  - it: Should not render RBAC when dataCache.namespaces is empty
    set:
      dataCache:
        enabled: true
        namespaces: []
    asserts:
      - hasDocuments:
          count: 0

  - it: Should render a ServiceAccount and a RoleBinding per namespace
    set:
      dataCache:
        enabled: true
        namespaces:
          - default
          - team-a
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.name
          value: kubeflow-trainer-cache-initializer
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: default
      - documentIndex: 2
        isKind:
          of: ServiceAccount
      - documentIndex: 2
        equal:
          path: metadata.namespace
          value: team-a
      - documentIndex: 3
        isKind:
          of: RoleBinding
      - documentIndex: 3
        equal:
          path: metadata.namespace
          value: team-a

  - it: Should bind the namespace ServiceAccount to the cache initializer ClusterRole
    set:
      dataCache:
        enabled: true
        namespaces:
          - default
    asserts:
      - documentIndex: 1
        isKind:
          of: RoleBinding
      - documentIndex: 1
        equal:
          path: metadata.name
          value: kubeflow-trainer-cache-initializer
      - documentIndex: 1
        equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: kubeflow-trainer-cache-initializer
      - documentIndex: 1
        contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: kubeflow-trainer-cache-initializer
            namespace: default
