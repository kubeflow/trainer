{{- if .Values.manager.podDisruptionBudget.enabled }}
{{- if lt (.Values.manager.replicas | int) 2 }}
{{- fail (printf "manager.podDisruptionBudget.enabled is true but manager.replicas is %d: a PodDisruptionBudget on a single replica blocks voluntary node drains and evictions indefinitely. Set manager.replicas to 2 or more, or disable manager.podDisruptionBudget." (.Values.manager.replicas | int)) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trainer.manager.deployment.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trainer.manager.selectorLabels" . | nindent 4 }}
    {{- with .Values.manager.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  minAvailable: {{ .Values.manager.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "trainer.manager.selectorLabels" . | nindent 6 }}
{{- end }}
