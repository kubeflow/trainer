# How to add an entry:
# 1. Copy one of the entries below and paste it at the bottom of this file.
# 2. Fill in the details and submit a pull request.
#
# Fields:
#  - title:    Title of the talk or article (Required)
#  - url:      URL to the recording, slides, or article (Required)
#  - date:     Publication date in YYYY-MM format, e.g. 2026-03 (Required)
#  - type:     One of: talk, case-study, tutorial, blog (Required)
#  - event:    Conference or publication, e.g. "KubeCon EU 2026" or "Kubeflow Blog" (Optional)
#  - adopters: Names of organizations from adopters.yaml this entry is about (Optional)
#
# Wrap values in double quotes if they contain a colon followed by a space.
# Entries are sorted by date on the website, so the order here does not matter.
