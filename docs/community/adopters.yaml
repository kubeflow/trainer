# =====================================================================
# KUBEFLOW TRAINER ADOPTERS
# =====================================================================
# This file is rendered as the adopters directory on the website:
# https://trainer.kubeflow.org/en/latest/community/adopters.html
#
# How to add your organization:
# 1. Copy one of the entries below and paste it at the bottom of this file.
# 2. Fill in the details and submit a pull request.
#
# Fields:
#  - name:        Organization name (Required)
#  - url:         Organization website URL (Required)
#  - type:        "End User" if you use Kubeflow Trainer for your own workloads, or
#                 "Provider" if you offer it as part of a product or service (Required)
#  - description: One sentence on how you use Kubeflow Trainer (Optional)
#  - contacts:    GitHub handles of people to contact about your adoption,
#                 without the leading @, e.g. andreyvelich (Optional)
#
# To show your talks, case studies, tutorials, and blog posts on your card, add them to
# docs/community/talks.yaml with your organization name in their "adopters" field.
#
# Entries are sorted by name on the website, so the order here does not matter.
# =====================================================================

